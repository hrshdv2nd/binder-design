[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "binder-triage"
version = "0.1.0"
description = "In-silico triage engine for protein binder design candidate selection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
binder-triage = "binder_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
